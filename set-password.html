<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Установка пароля — CANVASO</title>
  <link rel="stylesheet" href="account.css">
</head>
<body>
  <main class="account-shell">
    <a class="brand" href="index.html">CANVASO<span>Ваши моменты. На холсте.</span></a>
    <section class="auth-card">
      <h1>Создайте пароль</h1>
      <p>После этого вы сможете войти в личный кабинет и отслеживать свои заказы.</p>
      <form id="set-password-form" hidden>
        <label>Новый пароль<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Повторите пароль<input name="password_confirm" type="password" autocomplete="new-password" minlength="8" required></label>
        <p class="form-message" id="password-message" role="status"></p>
        <button type="submit">Сохранить пароль</button>
      </form>
      <p class="form-message" id="password-loading">Проверяем ссылку из письма…</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="set-password.js"></script>
</body>
</html>
