<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CANVASO — Заказы</title><link rel="stylesheet" href="admin.css"></head><body><main><a class="brand" href="index.html">CANVASO</a><section id="login"><h1>Вход в заказы</h1><form id="login-form"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Пароль" required><p id="login-error"></p><button>Войти</button></form></section><section id="orders-panel" hidden><header><h1>Заказы</h1><button id="logout">Выйти</button></header><div id="bulk-order-actions" hidden><span id="selected-order-count">Выбрано: 0</span><button id="delete-selected-orders" type="button">Удалить выбранные</button></div><div id="orders"></div><section class="admin-chats"><header class="admin-chats-heading"><h2>Чаты с клиентами</h2><button id="toggle-archived-chats" type="button">Показать архив</button></header><div class="admin-chat-layout"><aside id="chat-conversations" aria-label="Список диалогов"></aside><section class="admin-chat-thread"><header class="admin-chat-header"><span id="admin-chat-title">Выберите диалог</span><button id="archive-chat" type="button" hidden>Завершить и архивировать</button></header><div id="admin-chat-messages"></div><form id="admin-chat-form" hidden><textarea name="message" required maxlength="2000" placeholder="Написать клиенту…"></textarea><button>Отправить</button></form></section></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
